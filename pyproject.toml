[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "armproof"
version = "0.5.0"
description = "Fail-closed evidence gate for Arm AI optimization changes"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "ArmProof contributors"}]
dependencies = []

[project.scripts]
armproof = "armproof.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
