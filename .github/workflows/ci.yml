name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make check

  report-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PYTHONPATH=src python3.12 -m armproof.cli ci examples/armproof-reference/armproof.json --output report
      - run: npm run test:ui
      - name: Upload report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-screenshots
          path: build/screenshots
