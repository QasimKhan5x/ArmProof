name: ArmProof evidence gate
description: Fail closed when an Arm AI optimization claim is weak, regressed, or unattributed
branding:
  icon: shield
  color: green

inputs:
  config:
    description: Path to the versioned ArmProof CI configuration
    required: true
  output:
    description: Directory for decision JSON and the offline evidence report
    required: false
    default: armproof-report

outputs:
  decision:
    description: Path to the machine-readable release decision
    value: ${{ steps.gate.outputs.decision }}
  report:
    description: Path to the offline HTML evidence report
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install ArmProof
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Evaluate declared claims
      id: gate
      shell: bash
      env:
        ARMPROOF_CONFIG: ${{ inputs.config }}
        ARMPROOF_OUTPUT: ${{ inputs.output }}
      run: |
        mkdir -p "$ARMPROOF_OUTPUT"
        set +e
        armproof ci "$ARMPROOF_CONFIG" --output "$ARMPROOF_OUTPUT"
        gate_status=$?
        set -e

        if [ "$gate_status" -eq 1 ]; then
          echo "ArmProof could not evaluate the supplied evidence." >&2
          exit 1
        fi

        echo "decision=$ARMPROOF_OUTPUT/decision.json" >> "$GITHUB_OUTPUT"
        echo "report=$ARMPROOF_OUTPUT/index.html" >> "$GITHUB_OUTPUT"
        python "$GITHUB_ACTION_PATH/scripts/write_github_summary.py" \
          "$ARMPROOF_OUTPUT/decision.json" >> "$GITHUB_STEP_SUMMARY"
        exit "$gate_status"
